      - {column: D, analyte_id: si2_ergostanes, measurement_channel: si2_saturated_sterane_hopane_mrm, denominator_group: si2_chol_erg_stig_hops_sum, used: true}
      - {column: E, analyte_id: si2_stigmastanes, measurement_channel: si2_saturated_sterane_hopane_mrm, denominator_group: si2_chol_erg_stig_hops_sum, used: true}
      - {column: F, analyte_id: si2_hopanes, measurement_channel: si2_saturated_sterane_hopane_mrm, denominator_group: si2_chol_erg_stig_hops_sum, used: true}
      - {column: H, analyte_id: si2_cyclosteranes, measurement_channel: si2_cyclosterane_mrm, denominator_group: si2_cyclosterane_chol_erg_stig_sum, used: true}
